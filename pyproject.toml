[project]
name = "pydestiny"
version = "0.1.0"
description = "Machine-code-faithful Python reimplementation of Ultima V: Warriors of Destiny"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
pydestiny = "pydestiny.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["pydestiny*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
